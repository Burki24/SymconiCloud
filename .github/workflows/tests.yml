name: Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node for map UI tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run shared module tests
        uses: Burki24/Symcon_ModuleCI/php-tests@v1.0.0
        with:
          php-version: '8.5'
          php-extensions: curl, bcmath, dom, gd, exif
          test-command: php tests/run.php
